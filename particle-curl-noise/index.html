<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Curl Noise - GPGPU Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #0f0;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      max-width: 400px;
      z-index: 1000;
    }

    .info-panel h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #0f0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-panel p {
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 8px;
      color: rgba(0, 255, 0, 0.8);
    }

    .info-panel ul {
      list-style: none;
      font-size: 11px;
      color: rgba(0, 255, 0, 0.7);
      margin-top: 10px;
    }

    .info-panel ul li {
      padding: 3px 0;
    }

    .info-panel ul li::before {
      content: '▸ ';
      color: #0f0;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #0f0;
      text-align: center;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading" id="loading">Loading GPGPU System</div>
  </div>

  <div class="info-panel">
    <h2>Particle Curl Noise</h2>
    <p>GPGPU-accelerated particle system with curl noise flow field and mouse interaction.</p>
    <ul>
      <li>Divergence-free 3D curl noise</li>
      <li>Ping-pong FBO advection</li>
      <li>Attract/repel mouse modes</li>
      <li>Up to 500k particles @ 60 FPS</li>
    </ul>
  </div>

  <script type="module">
    import React, { useState, useCallback } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { ParticleCurlNoise } from './components/ParticleCurlNoise.jsx';
    import { ParticleControls } from './ui/ParticleControls.jsx';

    const DEFAULT_SETTINGS = {
      quality: 'medium',
      mouseMode: 1,
      noiseScale: 0.5,
      noiseSpeed: 0.1,
      mouseRadius: 2.0,
      mouseStrength: 5.0,
      pointSize: 2.0,
      opacity: 0.6,
      baseColor: [0.1, 0.8, 1.0],
      fastColor: [1.0, 0.2, 0.5],
      bounds: [10, 10],
    };

    function App() {
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [fps, setFPS] = useState(null);
      const [isReady, setIsReady] = useState(false);

      React.useEffect(() => {
        // Hide loading after a short delay
        setTimeout(() => {
          setIsReady(true);
          document.getElementById('loading')?.classList.add('hide');
        }, 500);
      }, []);

      const handleReset = useCallback(() => {
        setSettings(DEFAULT_SETTINGS);
      }, []);

      const updateSetting = (key, value) => {
        setSettings(prev => ({ ...prev, [key]: value }));
      };

      if (!isReady) return null;

      return (
        <>
          <ParticleCurlNoise
            quality={settings.quality}
            mouseMode={settings.mouseMode}
            baseColor={settings.baseColor}
            fastColor={settings.fastColor}
            noiseScale={settings.noiseScale}
            noiseSpeed={settings.noiseSpeed}
            mouseRadius={settings.mouseRadius}
            mouseStrength={settings.mouseStrength}
            pointSize={settings.pointSize}
            opacity={settings.opacity}
            bounds={settings.bounds}
            onFPSUpdate={setFPS}
          />
          <ParticleControls
            quality={settings.quality}
            onQualityChange={(v) => updateSetting('quality', v)}
            mouseMode={settings.mouseMode}
            onMouseModeChange={(v) => updateSetting('mouseMode', v)}
            noiseScale={settings.noiseScale}
            onNoiseScaleChange={(v) => updateSetting('noiseScale', v)}
            noiseSpeed={settings.noiseSpeed}
            onNoiseSpeedChange={(v) => updateSetting('noiseSpeed', v)}
            mouseRadius={settings.mouseRadius}
            onMouseRadiusChange={(v) => updateSetting('mouseRadius', v)}
            mouseStrength={settings.mouseStrength}
            onMouseStrengthChange={(v) => updateSetting('mouseStrength', v)}
            pointSize={settings.pointSize}
            onPointSizeChange={(v) => updateSetting('pointSize', v)}
            opacity={settings.opacity}
            onOpacityChange={(v) => updateSetting('opacity', v)}
            fps={fps}
            onReset={handleReset}
          />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
